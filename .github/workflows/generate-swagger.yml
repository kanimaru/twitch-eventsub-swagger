name: Generate Twitch EventSub Swagger

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Install Twitch CLI
        env:
          TWITCH_CLI_VERSION: "1.1.24"
        run: |
          archive="twitch-cli_${TWITCH_CLI_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/twitchdev/twitch-cli/releases/download/v${TWITCH_CLI_VERSION}"
          curl -fsSLO "$base/$archive"
          curl -fsSL "$base/checksums.txt" | grep " $archive\$" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/twitch-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/twitch-cli"
          dirname "$(find "$RUNNER_TEMP/twitch-cli" -type f -name twitch)" >> "$GITHUB_PATH"
          rm "$archive"

      - name: Run generator
        run: python generator.py

      # Checks the generated schema against the example notifications of the docs and the Twitch CLI. A mismatch
      # fails the job before the commit, so a wrong schema is never published.
      - name: Validate against Twitch payloads
        run: python validate.py --require-cli

      - name: Commit generated file
        run: |
          if git diff --quiet -- twitch_eventsub_swagger.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add twitch_eventsub_swagger.json
          git commit -m "Update generated Twitch EventSub swagger"
          git push